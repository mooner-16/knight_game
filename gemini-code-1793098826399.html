<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>중세 기사 멀티플레이어 FPS</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; color: white; font-family: 'Malgun Gothic', sans-serif; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .interactive { pointer-events: auto; }
        
        /* 로비 및 설정창 UI */
        #lobby, #settings-modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.9); padding: 30px; border: 2px solid #555; border-radius: 10px;
            text-align: center;
        }
        input, select, button { padding: 10px; margin: 10px 0; width: 100%; box-sizing: border-box; font-size: 16px; }
        button { background: #444; color: white; cursor: pointer; border: 1px solid #777; }
        button:hover { background: #666; }
        
        /* 인게임 HUD */
        #hud { display: none; position: absolute; bottom: 20px; left: 20px; }
        .bar-bg { width: 300px; height: 20px; background: #333; border: 1px solid #000; margin-bottom: 5px; }
        #hp-bar { width: 100%; height: 100%; background: red; transition: width 0.2s; }
        #stamina-bar { width: 100%; height: 100%; background: yellow; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
            background: white; border-radius: 50%; transform: translate(-50%, -50%); display: none;
        }
    </style>
    <!-- Three.js 및 Socket.io 로드 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

<div id="ui-layer">
    <div id="lobby" class="interactive">
        <h2>기사단 입소</h2>
        <input type="text" id="nickname" placeholder="닉네임을 입력하세요" value="기사1">
        
        <select id="class-select">
            <option value="paladin">성기사 (체력 200, 속도 보통, 힐 스킬)</option>
            <option value="berserker">광전사 (체력 120, 속도 빠름, 분노 스킬)</option>
            <option value="heavy">중갑기사 (체력 300, 속도 느림, 철벽 스킬)</option>
        </select>

        <button id="btn-start">게임 시작</button>
        <button id="btn-settings">설정</button>
    </div>

    <div id="settings-modal" class="interactive" style="display: none;">
        <h2>설정</h2>
        <label>마우스 감도: <input type="range" id="mouse-sens" min="0.001" max="0.01" step="0.001" value="0.002"></label><br><br>
        <button id="btn-close-settings">닫기</button>
    </div>

    <div id="hud">
        <div class="bar-bg"><div id="hp-bar"></div></div>
        <div class="bar-bg"><div id="stamina-bar"></div></div>
        <p id="hud-info" style="margin: 0; font-weight: bold;"></p>
    </div>
    <div id="crosshair"></div>
</div>

<script>
    const socket = io();

    // 1. 기사 스펙 설정
    const classSpecs = {
        paladin: { hp: 200, speed: 0.1, color: 0xffffff, skill: 'Heal' },
        berserker: { hp: 120, speed: 0.15, color: 0xff0000, skill: 'Rage' },
        heavy: { hp: 300, speed: 0.06, color: 0x555555, skill: 'Iron Wall' }
    };

    let mySpecs = null;
    let isGameStarted = false;
    
    // 조작 상태
    let keys = {};
    let isCrouching = false;
    let isBlocking = false;
    let isRunning = false;
    let sensitivity = 0.002;

    // UI 요소
    const lobby = document.getElementById('lobby');
    const settingsModal = document.getElementById('settings-modal');
    const hud = document.getElementById('hud');
    const crosshair = document.getElementById('crosshair');

    // 2. Three.js 초기화
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb); // 하늘색 배경
    
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // 바닥 생성
    const floorGeo = new THREE.PlaneGeometry(100, 100);
    const floorMat = new THREE.MeshBasicMaterial({ color: 0x228b22, side: THREE.DoubleSide });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = Math.PI / 2;
    scene.add(floor);

    // 다른 플레이어들을 담을 객체
    const otherPlayers = {};

    // 3. UI 이벤트 리스너
    document.getElementById('btn-settings').onclick = () => {
        lobby.style.display = 'none';
        settingsModal.style.display = 'block';
    };
    document.getElementById('btn-close-settings').onclick = () => {
        settingsModal.style.display = 'none';
        lobby.style.display = 'block';
        sensitivity = parseFloat(document.getElementById('mouse-sens').value);
    };

    document.getElementById('btn-start').onclick = () => {
        const nickname = document.getElementById('nickname').value;
        const selectedClass = document.getElementById('class-select').value;
        mySpecs = classSpecs[selectedClass];

        lobby.style.display = 'none';
        hud.style.display = 'block';
        crosshair.style.display = 'block';
        document.getElementById('hud-info').innerText = `${nickname} (${selectedClass})`;
        
        // 서버에 내 정보 전송
        socket.emit('joinGame', {
            name: nickname,
            knightClass: selectedClass,
            hp: mySpecs.hp,
            color: mySpecs.color
        });

        // 마우스 잠금 (FPS 시점)
        document.body.requestPointerLock();
        isGameStarted = true;
    };

    // 4. 멀티플레이어 소켓 이벤트 처리
    socket.on('updatePlayers', (serverPlayers) => {
        for (let id in serverPlayers) {
            if (id === socket.id) continue; // 나는 제외
            if (!otherPlayers[id]) {
                // 다른 플레이어 3D 큐브로 생성
                const geo = new THREE.BoxGeometry(1, 2, 1);
                const mat = new THREE.MeshBasicMaterial({ color: serverPlayers[id].color });
                const mesh = new THREE.Mesh(geo, mat);
                scene.add(mesh);
                otherPlayers[id] = mesh;
            }
            otherPlayers[id].position.set(serverPlayers[id].x, serverPlayers[id].y, serverPlayers[id].z);
            if(serverPlayers[id].isCrouching) {
                otherPlayers[id].scale.y = 0.5; // 앉으면 절반 크기
            } else {
                otherPlayers[id].scale.y = 1;
            }
        }
        // 나간 유저 삭제
        for (let id in otherPlayers) {
            if (!serverPlayers[id]) {
                scene.remove(otherPlayers[id]);
                delete otherPlayers[id];
            }
        }
    });

    socket.on('playerMoved', (data) => {
        if (otherPlayers[data.id]) {
            otherPlayers[data.id].position.set(data.x, data.y, data.z);
            otherPlayers[data.id].scale.y = data.isCrouching ? 0.5 : 1;
        }
    });

    socket.on('skillUsed', (data) => {
        // 스킬 사용 이펙트 (간단한 로그)
        console.log(`${data.id}님이 ${data.skillName} 스킬을 사용했습니다!`);
    });

    // 5. 키보드 및 마우스 조작 (달리기, 앉기, 막기, 스킬)
    document.addEventListener('keydown', (e) => { keys[e.code] = true; });
    document.addEventListener('keyup', (e) => { keys[e.code] = false; });

    document.addEventListener('mousedown', (e) => {
        if(!isGameStarted) return;
        if(e.button === 2) isBlocking = true; // 우클릭: 막기
        if(e.button === 0) attack();          // 좌클릭: 공격 (구현 확장용)
    });
    document.addEventListener('mouseup', (e) => {
        if(e.button === 2) isBlocking = false;
    });

    // 우클릭 메뉴 방지
    document.addEventListener('contextmenu', e => e.preventDefault());

    document.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement === document.body) {
            camera.rotation.y -= e.movementX * sensitivity;
            camera.rotation.x -= e.movementY * sensitivity;
            // 카메라 위아래 회전 제한
            camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
            camera.rotation.order = 'YXZ';
        }
    });

    function attack() {
        if(isBlocking) return; // 막는 중에는 공격 불가
        console.log("칼 휘두르기!");
        // 여기에 공격 로직 (Raycaster를 이용한 피격 판정) 추가 가능
    }

    let yaw = new THREE.Object3D();
    scene.add(yaw);
    yaw.add(camera);
    yaw.position.y = 1.6; // 기본 눈높이

    // 6. 게임 메인 루프 (렌더링 & 이동)
    function animate() {
        requestAnimationFrame(animate);

        if (isGameStarted && mySpecs) {
            let speed = mySpecs.speed;
            isRunning = keys['ShiftLeft'];
            if (isRunning) speed *= 1.5; // 쉬프트 누르면 달리기 (1.5배)

            isCrouching = keys['KeyC'] || keys['ControlLeft'];
            if (isCrouching) {
                yaw.position.y = 0.8; // 앉기: 눈높이 낮춤
                speed *= 0.5;         // 앉으면 속도 감소
            } else {
                yaw.position.y = 1.6;
            }

            // 스킬 사용 (E 키)
            if (keys['KeyE']) {
                keys['KeyE'] = false; // 연속 발동 방지
                socket.emit('useSkill', { skillName: mySpecs.skill });
            }

            // WASD 이동 로직 (카메라 방향 기준)
            const direction = new THREE.Vector3();
            if (keys['KeyW']) direction.z -= 1;
            if (keys['KeyS']) direction.z += 1;
            if (keys['KeyA']) direction.x -= 1;
            if (keys['KeyD']) direction.x += 1;

            direction.normalize();
            direction.applyEuler(new THREE.Euler(0, camera.rotation.y, 0));

            yaw.position.addScaledVector(direction, speed);

            // 서버로 내 위치 및 상태 실시간 전송
            socket.emit('playerStateUpdate', {
                x: yaw.position.x,
                y: yaw.position.y,
                z: yaw.position.z,
                isCrouching: isCrouching,
                isBlocking: isBlocking
            });
            
            // UI 업데이트 (막기 상태 등)
            document.getElementById('hud-info').innerText = 
                `클래스: ${document.getElementById('class-select').value} | 막기: ${isBlocking ? 'ON' : 'OFF'}`;
        }

        renderer.render(scene, camera);
    }

    animate();

    // 창 크기 변경 대응
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
